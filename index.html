<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alataa USDT</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f3f35;
      color:#fff;
    }

    .hero{
      padding:60px 20px;
      text-align:center;
    }

    .hero h1{
      font-size:40px;
      margin-bottom:15px;
    }

    .hero p{
      color:#d8d8d8;
      font-size:18px;
    }

    .container{
      max-width:450px;
      margin:30px auto;
      padding:20px;
    }

    .card{
      background:#fff;
      color:#111;
      padding:25px;
      border-radius:18px;
      margin-bottom:20px;
      text-decoration:none;
      display:block;
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-4px);
    }

    .buy{
      background:#145c4b;
      color:#fff;
    }

    h2{
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<div class="hero">
<h1>Alataa USDT</h1>
<p>تبادل سريع وآمن للعملات الرقمية</p>
</div>

<div class="container">

<a href="#" class="card">
<h2>💵 بيع USDT</h2>
<p>أرسل USDT واستلم المقابل بالشيكل.</p>
</a>

<a href="#" class="card buy">
<h2>🛒 شراء USDT</h2>
<p>ادفع بالشيكل واستلم USDT في محفظتك.</p>
</a>

</div>

</body>
</html>
